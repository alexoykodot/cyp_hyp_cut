<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lasercutter Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: #334155;
            border-radius: 4px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background-color: #0f172a;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans antialiased">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-lg flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-cyan-500"></span>
            </div>
            <h1 class="text-lg md:text-xl font-bold tracking-wider text-slate-100">Lasercutter <span class="text-red-500">A</span>ss<span class="text-red-500">i</span>stant</h1>
        </div>
        <span class="text-xs font-mono bg-cyan-950 text-cyan-400 px-3 py-1 rounded-full border border-cyan-800">Laser Manual Mode</span>
    </header>

    <!-- Main Container -->
    <div class="flex-1 flex flex-col overflow-hidden max-w-5xl w-full mx-auto p-2 md:p-4">

        <main class="flex-1 bg-slate-900 rounded-2xl border border-slate-800 flex flex-col overflow-hidden shadow-2xl">

            <!-- Chat Window -->
            <div id="chatWindow" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 chat-scroll">
                <!-- Initial Welcome Message -->
                <div class="flex items-start gap-3">
                    <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center text-sm font-bold flex-shrink-0 shadow-lg shadow-indigo-500/20">
                        🤖
                    </div>
                    <div class="bg-slate-800/90 rounded-2xl p-4 text-slate-200 text-sm max-w-[85%] leading-relaxed border border-slate-700/60 shadow-md">
                        Είμαι ο ψηφιακός σου βοηθός, μπορώ να σου απαντήσω την ερώτηση σε κάθε τι που χρειάζεσαι!
                    </div>
                </div>
            </div>

            <!-- Bottom Controls Container -->
            <div class="p-3 md:p-4 bg-slate-900/95 border-t border-slate-800/80 space-y-3">

                <!-- Quick Preset Questions (Placed ABOVE input box) -->
                <div class="flex items-center gap-2 overflow-x-auto pb-1 chat-scroll text-xs">
                    <span class="text-slate-500 font-medium whitespace-nowrap pl-1">Γρήγορες Ερωτήσεις:</span>

                    <button onclick="askPreset('Πώς αντιμετωπίζω ένα αλάρμ (Alarm) στο HypCut;')"
                        class="whitespace-nowrap px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition border border-slate-700/80 hover:border-slate-500">
                        🚨 Αντιμετώπιση Alarm
                    </button>

                    <button onclick="askPreset('Πώς κάνω εύρεση μηδενικού σημείου μετά από διακοπή;')"
                        class="whitespace-nowrap px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition border border-slate-700/80 hover:border-slate-500">
                        🎯 Εύρεση Μηδενικού
                    </button>

                    <button onclick="askPreset('Πώς ρυθμίζω τις παραμέτρους κοπής και διάτρησης (Pierce);')"
                        class="whitespace-nowrap px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition border border-slate-700/80 hover:border-slate-500">
                        🔥 Παράμετροι Κοπής & Pierce
                    </button>

                    <button onclick="askPreset('Τι είναι το Fly Cut (Flying Cut) και πώς ρυθμίζεται;')"
                        class="whitespace-nowrap px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition border border-slate-700/80 hover:border-slate-500">
                        ⚡ Λειτουργία Fly Cut
                    </button>

                    <button onclick="askPreset('Πώς βάζω Lead Lines (γραμμές εισόδου/εξόδου);')"
                        class="whitespace-nowrap px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition border border-slate-700/80 hover:border-slate-500">
                        📐 Ρύθμιση Lead Lines
                    </button>

                    <button onclick="askPreset('Πώς κάνω ευθυγράμμιση λαμαρίνας (Edge Seek / Alignment);')"
                        class="whitespace-nowrap px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition border border-slate-700/80 hover:border-slate-500">
                        📐 Ευθυγράμμιση Λαμαρίνας
                    </button>

                    <button onclick="askPreset('Πώς βάζω Micro-joints (μικροσυνδέσεις);')"
                        class="whitespace-nowrap px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition border border-slate-700/80 hover:border-slate-500">
                        🔗 Χρήση Micro-joints
                    </button>
                </div>

                <!-- Input Form -->
                <form id="chatForm" onsubmit="handleUserSubmit(event)" class="flex gap-2">
                    <input
                        type="text"
                        id="userInput"
                        placeholder="Ρωτήστε οτιδήποτε σχετικά με το HypCut και τη λειτουργία του..."
                        class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                        autocomplete="off"
                    />
                    <button
                        type="submit"
                        class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-3 rounded-xl text-sm transition flex items-center gap-2 shadow-lg shadow-indigo-600/20 active:scale-95">
                        <span>Αποστολή</span>
                        <span>➔</span>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- Knowledge Base Script -->
    <script>
        const kb = [
            {
                keywords: ['παραμέτρους κοπής', 'παραμετρους κοπης', 'ρυθμίσεις κοπής', 'ρυθμισεις κοπης', 'layer settings'],
                short: "**Παράμετροι Κοπής:** Pierce (διάτρηση), Cutting Parameters (ταχύτητα/ύψος/αέριο) και Focus (εστίαση). Ρώτα με για καθεμία ξεχωριστά αν θες λεπτομέρειες.",
                full: "**Ρύθμιση Παραμέτρων Κοπής (Layer Settings):**\n• **Pierce (Διάτρηση):** Ρυθμίζεται σε στάδια (Pierce 1, 2, 3) ανάλογα με το πάχος του υλικού. Ορίζονται ο χρόνος, η πίεση αερίου, η ισχύς και το ύψος διάτρησης.\n• **Cutting Parameters:** Καθορίζουν την ταχύτητα κοπής, το ύψος του ακροφυσίου (Cut Height), το είδος αερίου (O2, N2, Air) και την πίεση.\n• **Focus Pos:** Ρυθμίζει την εστίαση της δέσμης (θετικό focus για μεγάλα πάχη/O2, αρνητικό focus για ανοξείδωτο/N2)."
            },
            {
                keywords: ['αλαρμ', 'αλάρμ', 'alarm', 'σφάλμα', 'προειδοποίηση', 'error', 'bcs100', 'limit', 'τερμα'],
                short: "Όταν βγει **Alarm**, η κίνηση σταματάει αυτόματα. Δες την αιτία και κάνε reset (HypCut: Diagnosis→Alarm Log· CypCut: παράθυρο Alarm/BCS100).",
                full: "**Αντιμετώπιση Alarm — δύο συστήματα, μικρές διαφορές:**\n• **HypCut (BOCHU):** Η κίνηση σταματάει αυτόματα, η μπάρα κατάστασης γίνεται κόκκινη/κίτρινη. Δες όλα τα ιστορικά/ενεργά alarm στο **Diagnosis → Alarm Log**, διόρθωσε την αιτία και κάνε Reset.\n• **CypCut (Friendess):** Ο τίτλος του παραθύρου γίνεται κόκκινος με το μήνυμα σφάλματος, και το κάτω παράθυρο **'Alarm'** καταγράφει όλα τα μηνύματα. Υπάρχει ειδικά το **BCS100 alarm** (σφάλμα κεφαλής/χωρητικότητας) που μπλοκάρει κίνηση X/Y μέχρι να γίνει reset — αν είναι ενεργοποιημένο το 'remove alarms manually' στο config tool, χρειάζεται χειροκίνητο reset πατώντας το κουμπί reset στο κάτω μέρος. Emergency stop μπλοκάρει τελείως την κίνηση."
            },
            {
                keywords: ['μηδενικό', 'μηδεν', 'διακοπή', 'breakpoint', 'διακοπη', 'ρεύμα', 'ρευμα', 'stop', 'zero', 'origin'],
                short: "**Return Zero** για απλή διακοπή, **Return Origin** αν χάθηκε η θέση, **Pt LOC + Pt CONT** για συνέχιση από το breakpoint.",
                full: "**Επαναφορά & Εύρεση Μηδενικού Σημείου (HypCut):**\n• **Return Origin:** Επαναφέρει το μηχανικό μηδέν (machine coordinate) στους άξονες X/Y — απαιτείται μετά από εκκίνηση, διακοπή ρεύματος ή servo alarm. Μέχρι να γίνει, επιτρέπεται μόνο αργή χειροκίνητη κίνηση.\n• **Return Zero:** Επιστρέφει την κεφαλή στο καταγεγραμμένο program zero point (σημείο έναρξης του προγράμματος) — χρησιμοποιείται για απλή διακοπή χωρίς απώλεια θέσης.\n• **Breakpoint:** Στο Production, το κουμπί **Breakpoint** ανακαλεί αυτόματα το τελευταίο σημείο διακοπής (αν δεν άλλαξε σχέδιο/τεχνική) ώστε να συνεχίσεις την κοπή από εκεί."
            },
            {
                keywords: ['pierce', 'διάτρηση', 'διατρηση', 'smooth pierce', 'flash pierce', 'segment pierce', 'incremental pierce', 'pre-pierce', 'group pre-pierce'],
                short: "**HypCut:** Smooth/Incremental/Flash/Segment Pierce. **CypCut:** segmented/incremental pierce + pre-pierce/group pre-pierce.",
                full: "**Τύποι Pierce — διαφορετική ορολογία ανά σύστημα:**\n• **HypCut (BOCHU), Production → Technique → Piercing:** Smooth Pierce (frog leap με σταδιακή μετάβαση ύψους/εστίασης), Incremental Pierce (παραμονή ανά στάδιο ύψους), Flash Pierce (για χοντρές πλάκες), Segment Pierce (διαφορετικές παράμετροι ανά ύψος/διάρκεια).\n• **CypCut (Friendess), Layer window:** Segmented pierce και Incremental pierce (ίδια λογική με πολλαπλά στάδια ύψους/ισχύος), **Pre-pierce** (διάτρηση σε όλα τα σημεία εκκίνησης πριν ξεκινήσει καθόλου η κοπή), **Group pre-pierce** (διάτρηση+κοπή ανά ομάδα πριν προχωρήσει στην επόμενη). Σημείωση: pre-pierce δεν συνδυάζεται με evaporate film."
            },
            {
                keywords: ['cutting parameters', 'ταχύτητα κοπής', 'ταχυτητα κοπης', 'cut height', 'είδος αερίου', 'ειδος αεριου', 'γκαζι', 'αέριο', 'αεριο', 'πίεση', 'πιεση', 'power', 'ισχύς', 'ισχυς'],
                short: "Τα **Cutting Parameters** ρυθμίζουν ταχύτητα κοπής, ύψος ακροφυσίου (Cut Height), είδος αερίου (O2/N2/Air) και πίεση.",
                full: "**Cutting Parameters:**\nΚαθορίζουν την ταχύτητα κοπής, το ύψος του ακροφυσίου (Cut Height), το είδος αερίου (O2, N2, Air) και την πίεσή του. Οι σωστές τιμές εξαρτώνται από το πάχος και τον τύπο του υλικού (π.χ. O2 για μαλακό χάλυβα, N2 για ανοξείδωτο/αλουμίνιο)."
            },
            {
                keywords: ['focus', 'εστίαση', 'εστιαση'],
                short: "Το **Focus Pos** ρυθμίζει την εστίαση της δέσμης: θετικό για μεγάλα πάχη/O2, αρνητικό για ανοξείδωτο/N2.",
                full: "**Focus Pos (Εστίαση Δέσμης):**\nΡυθμίζει το σημείο εστίασης της δέσμης λέιζερ σε σχέση με την επιφάνεια του υλικού. Θετικό focus χρησιμοποιείται συνήθως για μεγάλα πάχη με O2, ενώ αρνητικό focus για ανοξείδωτο ή αλουμίνιο με N2, ώστε να βελτιστοποιείται η ποιότητα κοπής."
            },
            {
                keywords: ['fly cut', 'flying cut', 'γρήγορη κοπή', 'σκανάρισμα', 'flycut'],
                short: "Το **Fly Cut** κόβει γρήγορα συστοιχίες όμοιων σχημάτων χωρίς να σηκώνεται η κεφαλή σε κάθε σχήμα.",
                full: "**Λειτουργία Fly Cut (Flying Cut):**\n• Χρησιμοποιείται για ταχύτατη κοπή συστοιχιών όμοιων σχημάτων (π.χ. διάτρητα πλέγματα, κύκλοι, τετράγωνα).\n• Η κεφαλή διατηρεί σταθερό ύψος και ταχύτητα χωρίς να ανοιγοκλείνει το ύψος του ακροφυσίου σε κάθε περίγραμμα.\n• Απαιτείται προηγουμένως σωστή ταξινόμηση (*Sort*) της διαδρομής."
            },
            {
                keywords: ['lead line', 'lead', 'εισόδου', 'εισοδου', 'γραμμή εισόδου', 'lead-in', 'lead in', 'εξόδου'],
                short: "Τα **Lead Lines** προστατεύουν το κομμάτι από κάψιμο στη διάτρηση· ρυθμίζονται από το μενού **Lead**.",
                full: "**Διαμόρφωση Lead Lines (Εισόδου/Εξόδου):**\n• Εμποδίζουν το κάψιμο/σημάδι του λέιζερ πάνω στο τελικό περίγραμμα κατά τη διάτρηση.\n• Ρυθμίζονται από το μενού **Lead** (Επιλογή τύπου: Ευθεία, Τόξο, Γωνία & Μήκος εισόδου).\n• Με το **Lead Pos** αλλάζετε το σημείο όπου ξεκινάει η κοπή.\n• Πατήστε **Check Lead Lines** για να βεβαιωθείτε ότι δεν τέμνονται με γειτονικά κομμάτια."
            },
            {
                keywords: ['ευθυγράμμιση', 'ευθυγραμμιση', 'edge', 'find edge', 'γωνία', 'γωνια', 'λαμαρίνα', 'λαμαρινα', 'align', 'capacitive', 'circle centering', 'bcs100', 'infrared'],
                short: "**HypCut:** Capacitive Find Edge (3/4/6 σημείων), Circle Centering, Photoelectric/Optical. **CypCut:** BCS100 Find Edge, Infrared (Omron), Manual.",
                full: "**Find Edge — διαφορετικές μέθοδοι ανά σύστημα:**\n• **HypCut (BOCHU):** Capacitive Find Edge (3-point quick / 4-point precise / 6-point slat-avoid για λεπτά φύλλα), Single Side 2-Point (μόνο γωνία, όχι μηδενικό), Circle Centering (κυκλικές πλάκες), Photoelectric Find Edge, Optical Find Edge (κάμερα).\n• **CypCut (Friendess):** **BCS100 Find Edge** (χρειάζεται BCS100 controller· single-point ή three-point, κλίση πλάκας ≤10°), **Infrared Find Edge** (φωτοηλεκτρικός αισθητήρας Omron E3Z-L61, κλίση ≤40°, χρειάζεται μέτρηση απόκλισης αισθητήρα/κεφαλής την πρώτη φορά), και χειροκίνητη ευθυγράμμιση.\nΚαι στα δύο, το αποτέλεσμα (γωνία περιστροφής) εμφανίζεται πάνω δεξιά στο σχέδιο."
            },
            {
                keywords: ['micro-joint', 'micro joint', 'μικροσύνδεση', 'συγκράτηση', 'joint', 'joint'],
                short: "Τα **Micro-joints** αφήνουν μικρό άκοπο σημείο για να μην πέφτει το κομμάτι· προστίθενται με το κουμπί **Micro Joint**.",
                full: "**Χρήση Micro-joints (Μικροσυνδέσεων):**\n• Αφήνουν ελάχιστο άκοπο σημείο (π.χ. 0.5mm - 1mm) ώστε τα κομμένα εξαρτήματα να μην πέφτουν ή να μην ανασηκώνονται προκαλώντας σύγκρουση με την κεφαλή.\n• Προστίθενται με το κουμπί **Micro Joint** (χειροκίνητα με κλικ πάνω στη διαδρομή ή αυτόματα βάσει απόστασης).\n• Αφαιρούνται με το **Clear MicroJoint**."
            },
            {
                keywords: ['frame', 'dry cut', 'δοκιμή', 'περιδιάβαση', 'προεπισκόπηση', 'πλαίσιο'],
                short: "**Frame** διαγράφει μόνο το πλαίσιο χωρίς κοπή· **Dry Cut** τρέχει όλη τη διαδρομή με κλειστό το λέιζερ.",
                full: "**Έλεγχος Διαδρομής (Frame & Dry Cut):**\n• **Frame (Περιδιάβαση):** Η κεφαλή διαγράφει το εξωτερικό ορθογώνιο περίγραμμα του σχεδίου στο τραπέζι (χωρίς λέιζερ/αέριο) για επιβεβαίωση ότι το υλικό επαρκεί.\n• **Dry Cut (Ξηρή Δοκιμή):** Εκτελείται ολόκληρη η διαδρομή κοπής σε πραγματικό χρόνο αλλά με κλειστή τη δέσμη λέιζερ."
            },
            {
                keywords: ['nesting', 'νεστινγκ', 'τοποθέτηση', 'οικονομία', 'βέλτιστη', 'cypnest', 'fill up', 'array', 'nest'],
                short: "**CypCut:** έχει ενσωματωμένο πλήρες Nesting module. **HypCut:** το nesting γίνεται στο ξεχωριστό CypNest· μέσα έχει μόνο Fill Up/Array.",
                full: "**Nesting — μεγάλη διαφορά μεταξύ των δύο συστημάτων:**\n• **CypCut (Friendess):** Έχει πλήρες ενσωματωμένο **Nest module** — parts library (έως 50 τύποι), plate library, αυτόματο nesting με ρυθμίσεις κενού/περιθωρίου/γωνίας περιστροφής, co-edge, διαχείριση υπολειμμάτων (remnant), έκδοση αναφοράς κόστους, μέχρι 20 πλάκες ταυτόχρονα.\n• **HypCut (BOCHU):** ΔΕΝ κάνει πλήρες nesting μόνο του — συνεργάζεται με το ξεχωριστό λογισμικό **CypNest**, από όπου εισάγονται τα αρχεία (nrp/nrp2) μέσω δικτύου ή USB στο **Plan** module. Μέσα στο HypCut υπάρχει μόνο απλό **Fill Up** (γέμισμα φύλλου με αντίγραφα ενός σχεδίου) και **Array** (ορθογώνια διάταξη)."
            },
            {
                keywords: ['quick cutoff', 'γρήγορη κοπή πλάκας', 'κόψιμο πλακας', 'cutoff'],
                short: "Το **Quick CutOff** κόβει γρήγορα την πλάκα στα δύο με τις παραμέτρους του τρέχοντος σχεδίου· ρυθμίζεται και από το WKB τηλεχειριστήριο.",
                full: "**Quick CutOff:**\n• Χρησιμοποιεί προεπιλεγμένα τις παραμέτρους τεχνικής του τρέχοντος σχεδίου (large contour) για γρήγορη κοπή/διαχωρισμό της πλάκας.\n• Ξεχωρίζει **λεπτή** (≤4mm) από **χοντρή** (≥4mm) πλάκα — για λεπτές πλάκες τα πρώτα 10mm κόβονται με σταθερό ύψος λόγω τάσης για παραμόρφωση στις άκρες.\n• Ρυθμίσεις: κατεύθυνση κοπής, ταχύτητα (0-120%), και **Extension cut** για πλήρη διαχωρισμό όταν η κοπή δεν είναι κάθετη.\n• Μπορεί να ενεργοποιηθεί κι από το ασύρματο τηλεχειριστήριο **WKB**."
            },
            {
                keywords: ['καθαρισμός', 'φακός', 'φακος', 'ακροφύσιο', 'ακροφυσιο', 'nozzle', 'lens', 'συντήρηση', 'συντηρηση', 'clean nozzle', 'replace nozzle'],
                short: "Το HypCut έχει αυτόματο **Clean Nozzle** (βούρτσα) και **Auto Replace Nozzle**, με trigger βάσει αριθμού διατρήσεων/μήκους κοπής.",
                full: "**Συντήρηση Ακροφυσίου στο HypCut:**\n• **Clean Nozzle** (Production → Auxiliary → Auto Nozzle): καθαρίζει το ακροφύσιο με βούρτσα + φύσημα αερίου, σε καθορισμένη θέση φιξαρίσματος.\n• **Auto Replace Nozzle**: αυτόματη αλλαγή ακροφυσίου από σταθμό αποθήκευσης (π.χ. BNR240), όταν ξεπεραστεί ένα όριο (πλήθος διατρήσεων, μήκος κοπής, ή διάρκεια).\n• Η γενική συντήρηση όλων των εξαρτημάτων (ρακ, μοτέρ, βαλβίδες αερίου) παρακολουθείται στο **Maintenance** module, με υπενθυμίσεις βάσει προκαθορισμένων ορίων."
            }
        ];

        // "Μεσάζοντας" (Cloudflare Worker) που κρατάει το Gemini API key κρυφό
        const AI_ENDPOINT = "https://hypcypcut-ai.ramnalialexandra.workers.dev";

        function askPreset(questionText) {
            document.getElementById('userInput').value = questionText;
            handleUserSubmit(new Event('submit'));
        }

        async function handleUserSubmit(event) {
            event.preventDefault();
            const inputEl = document.getElementById('userInput');
            const query = inputEl.value.trim();
            if (!query) return;

            // Display User Message
            appendMessage(query, 'user');
            inputEl.value = '';

            // 1) Πρώτα ψάχνει στην τοπική βάση γνώσης (άμεσο, χωρίς κόστος)
            const kbAnswer = getKbAnswer(query);
            if (kbAnswer) {
                setTimeout(() => appendMessage(kbAnswer, 'bot'), 300);
                return;
            }

            // 2) Αν δεν βρεθεί, ρωτάει το AI (Gemini) μέσω του μεσάζοντα
            const thinkingBubble = appendMessage('Σκέφτομαι… 🤔', 'bot');
            try {
                const aiAnswer = await askAI(query);
                updateMessage(thinkingBubble, aiAnswer);
            } catch (err) {
                updateMessage(thinkingBubble, fallbackAnswer(query));
            }
        }

        function getKbAnswer(query) {
            const lowerQuery = query.toLowerCase();
            const wordCount = query.trim().split(/\s+/).filter(Boolean).length;

            // Στοχευμένη σύντομη απάντηση για σύντομες/συγκεκριμένες ερωτήσεις,
            // πλήρης αναλυτική απάντηση για εκτενέστερες/γενικές ερωτήσεις
            for (const item of kb) {
                if (item.keywords.some(kw => lowerQuery.includes(kw))) {
                    return wordCount <= 4 ? item.short : item.full;
                }
            }
            return null;
        }

        async function askAI(question) {
            const res = await fetch(AI_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question })
            });
            if (!res.ok) throw new Error('AI request failed');
            const data = await res.json();
            if (data.error) throw new Error(data.error);
            return data.answer;
        }

        function fallbackAnswer(query) {
            return "Δεν μπόρεσα να συνδεθώ με τον AI βοηθό αυτή τη στιγμή (πιθανόν πρόβλημα δικτύου).\n\n" +
                   "Δοκίμασε ξανά σε λίγο, ή ρώτα με κάτι από τα βασικά θέματα του HypCut που ξέρω ήδη: *\"αλάρμ\"*, *\"μηδενικό\"*, *\"pierce\"*, *\"fly cut\"*, *\"find edge\"*, *\"lead lines\"*, *\"quick cutoff\"* ή *\"συντήρηση\"*.";
        }

        function appendMessage(text, sender) {
            const chatWindow = document.getElementById('chatWindow');
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex items-start gap-3 ${sender === 'user' ? 'flex-row-reverse' : ''}`;

            const avatar = document.createElement('div');
            avatar.className = `w-9 h-9 rounded-xl flex items-center justify-center text-sm font-bold flex-shrink-0 shadow-lg ${
                sender === 'user'
                    ? 'bg-slate-700 text-slate-200'
                    : 'bg-indigo-600 text-white shadow-indigo-500/20'
            }`;
            avatar.innerText = sender === 'user' ? '👤' : '🤖';

            const bubble = document.createElement('div');
            bubble.className = `rounded-2xl p-4 text-sm max-w-[85%] leading-relaxed shadow-md ${
                sender === 'user'
                    ? 'bg-indigo-600 text-white rounded-tr-none'
                    : 'bg-slate-800/90 text-slate-200 border border-slate-700/60 rounded-tl-none'
            }`;

            // Format newlines & bold text
            bubble.innerHTML = text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            msgDiv.appendChild(avatar);
            msgDiv.appendChild(bubble);
            chatWindow.appendChild(msgDiv);

            chatWindow.scrollTop = chatWindow.scrollHeight;
            return bubble;
        }

        function updateMessage(bubble, text) {
            bubble.innerHTML = text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            document.getElementById('chatWindow').scrollTop = document.getElementById('chatWindow').scrollHeight;
        }
    </script>
</body>
