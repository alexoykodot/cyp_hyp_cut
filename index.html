<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lasercutter Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .manual-gallery { display: grid; gap: 16px; margin-top: 16px; }
        .manual-gallery figure { min-width: 0; margin: 0; }
        .manual-gallery a { display: block; border-radius: 4px; overflow: hidden; background: white; }
        .manual-gallery a:focus-visible { outline: 3px solid #22d3ee; outline-offset: 3px; }
        .manual-gallery img { display: block; width: 100%; height: auto; max-height: 360px; object-fit: contain; }
        .manual-gallery figcaption { margin-top: 4px; font-size: 12px; color: #94a3b8; }
        body { height: auto !important; min-height: 100vh; }
        body > div { overflow: visible !important; }
        #chatWindow { flex: none; height: 45vh; min-height: 240px; }
        #categoryBar { flex-wrap: wrap; overflow: visible; }
        #topicBar {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            overflow: visible;
            align-items: stretch;
        }
        #categoryBar button, #topicBar button {
            min-width: 0;
            max-width: 100%;
            white-space: normal;
            overflow-wrap: anywhere;
            text-align: left;
        }
        #topicBar button { padding-top: 8px; padding-bottom: 8px; }
        #userInput { min-width: 0; }
        @media (max-width: 767px) {
            #topicBar { grid-template-columns: minmax(0, 1fr); }
        }
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: #334155;
            border-radius: 4px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background-color: #0f172a;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans antialiased">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-lg flex items-center justify-between gap-3 flex-wrap">
        <div class="flex items-center space-x-3">
            <div class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-cyan-500"></span>
            </div>
            <h1 class="text-lg md:text-xl font-bold tracking-wider text-slate-100">Lasercutter <span class="text-red-500">A</span>ss<span class="text-red-500">i</span>stant</h1>
        </div>

        <div class="flex items-center gap-3">
            <!-- System Toggle: HypCut / CypCut -->
            <div id="systemToggle" class="flex bg-slate-950 border border-slate-700 rounded-full p-1 text-xs font-semibold">
                <button id="btnHypcut" onclick="setSystem('hypcut')" class="px-3 py-1.5 rounded-full transition">HypCut</button>
                <button id="btnCypcut" onclick="setSystem('cypcut')" class="px-3 py-1.5 rounded-full transition">CypCut</button>
            </div>
            <span class="text-xs font-mono bg-cyan-950 text-cyan-400 px-3 py-1 rounded-full border border-cyan-800">Laser Manual Mode</span>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex-1 flex flex-col overflow-hidden max-w-5xl w-full mx-auto p-2 md:p-4">

        <main class="flex-1 bg-slate-900 rounded-2xl border border-slate-800 flex flex-col overflow-hidden shadow-2xl">

            <!-- Chat Window -->
            <div id="chatWindow" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 chat-scroll">
                <!-- Initial Welcome Message -->
                <div class="flex items-start gap-3">
                    <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center text-sm font-bold flex-shrink-0 shadow-lg shadow-indigo-500/20">
                        🤖
                    </div>
                    <div class="bg-slate-800/90 rounded-2xl p-4 text-slate-200 text-sm max-w-[85%] leading-relaxed border border-slate-700/60 shadow-md">
                        Είμαι ο ψηφιακός σου βοηθός για <strong>HypCut</strong> και <strong>CypCut</strong>. Διάλεξε πάνω δεξιά ποιο σύστημα σε ενδιαφέρει, μετά διάλεξε κατηγορία από κάτω ή ρώτα με ελεύθερα οτιδήποτε.
                    </div>
                </div>
            </div>

            <!-- Bottom Controls Container -->
            <div class="p-3 md:p-4 bg-slate-900/95 border-t border-slate-800/80 space-y-3">

                <!-- Category / Topic Browser -->
                <div class="space-y-2 text-xs">
                    <div class="flex items-center gap-2 overflow-x-auto pb-1 chat-scroll" id="categoryBar">
                        <span class="text-slate-500 font-medium whitespace-nowrap pl-1">Κατηγορίες:</span>
                        <!-- category chips injected by JS -->
                    </div>
                    <div class="flex items-center gap-2 overflow-x-auto pb-1 chat-scroll" id="topicBar">
                        <!-- topic buttons injected by JS -->
                    </div>
                </div>

                <!-- Input Form -->
                <form id="chatForm" onsubmit="handleUserSubmit(event)" class="flex gap-2">
                    <input
                        type="text"
                        id="userInput"
                        placeholder="Ρωτήστε οτιδήποτε..."
                        class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                        autocomplete="off"
                    />
                    <button
                        type="submit"
                        class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-3 rounded-xl text-sm transition flex items-center gap-2 shadow-lg shadow-indigo-600/20 active:scale-95">
                        <span>Αποστολή</span>
                        <span>➔</span>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- Knowledge Base Script -->
    <script>
        // =====================================================================
        // Δομή: SYSTEMS[system].categories[].topics[]
        // Οι κατηγορίες αντιστοιχούν 1:1 στα κεφάλαια των επίσημων manuals
        // (HypCut v1.5 / FSCUT8000, CypCut v6.5) — όχι εφευρημένη ταξινόμηση.
        // Κάθε topic: keywords (για αναζήτηση), short (σύντομη), full (αναλυτική).
        // =====================================================================

        const SYSTEMS = {
            hypcut: {
                label: 'HypCut',
                categories: [
                    // 1. Γενικά -------------------------------------------------
                    {
                        id: 'general', title: 'Γενικά',
                        topics: [
                            {
                                keywords: ['τι είναι το hypcut', 'τι ειναι το hypcut', 'hyptronic', 'hypanel', 'γενικά hypcut', 'γενικα hypcut'],
                                question: 'Τι είναι το HypCut και σε τι ελεγκτή τρέχει;',
                                short: "Το **HypCut** είναι το πρόγραμμα κοπής της BOCHU για laser μεγάλης ισχύος. Τρέχει προεγκατεστημένο στον ελεγκτή **HypTronic/HyPanel** (EtherCAT).",
                                full: "**Γενικά:**\nΤο HypCut φτιάχτηκε για laser μεγάλης ισχύος. Έχει έτοιμα μοντέλα κοπής, οργάνωση παραγωγής ανά παραγγελία και απλή χρήση με ενότητες (Plan, Production, Debug, Technique, Diagnosis, Maintenance, Settings).\nΈρχεται ήδη εγκατεστημένο στον ελεγκτή **HypTronic/HyPanel** (EtherCAT) και δουλεύει μόλις ανάψει. Ο ελεγκτής έχει επαναφορά με ένα κουμπί στις εργοστασιακές ρυθμίσεις, αν κάτι πάει στραβά.\nΓια αρχείο εγκατάστασης (αναβάθμιση/επαναφορά) χρειάζεται ο προμηθευτής ή η τεχνική υποστήριξη."
                            }
                        ]
                    },
                    // 2. Γρήγορη Εκκίνηση ----------------------------------------
                    {
                        id: 'quickstart', title: 'Γρήγορη Εκκίνηση',
                        topics: [
                            {
                                keywords: ['ανοιγμα hypcut', 'άνοιγμα hypcut', 'εκκινηση hypcut', 'εκκίνηση hypcut', 'πρωτη φορα', 'πρώτη φορά'],
                                question: 'Πώς ανοίγω το HypCut την πρώτη φορά;',
                                short: "Βεβαιωθείτε ότι όλα είναι αναμμένα, διπλό κλικ στο εικονίδιο HypCut, και μόλις τελειώσει ο αυτοέλεγχος κάντε **Return Origin** (χωρίς αυτό, μόνο αργή χειροκίνητη κίνηση).",
                                full: "**Άνοιγμα του HypCut:**\n1. Βεβαιωθείτε ότι όλα τα ηλεκτρολογικά είναι συνδεδεμένα και αναμμένα.\n2. Διπλό κλικ στο εικονίδιο HypCut. Φορτώνει και κάνει αυτοέλεγχο.\n3. Μόλις τελειώσει, ζητά **Return Origin** (η μηχανή πάει στο «σπίτι» της και μαθαίνει πού βρίσκεται).\n\nΧωρίς σωστή θέση, οι αυτοματισμοί και η ακρίβεια κοπής δεν δουλεύουν — αν δεν κάνετε Return Origin, βγάζει συναγερμό και επιτρέπει μόνο αργή κίνηση με το χέρι.\nΤο κουμπί **Return Zero** αναβοσβήνει → πατώντας το κάνει Return Origin. Είναι γκρι → πατώντας το κάνει Return Zero (μηδέν δουλειάς).\n⚠️ Αν υπάρχουν άλλοι συναγερμοί στην εκκίνηση, μηδενίστε τους πρώτα."
                            },
                            {
                                keywords: ['οθονη hypcut', 'οθόνη hypcut', 'τι βλεπω', 'τι βλέπω', 'περιοχες οθονης', 'περιοχές οθόνης'],
                                question: 'Τι βλέπω στην οθόνη του HypCut;',
                                short: "6 περιοχές: γραμμή κατάστασης (πάνω), μηνύματα/συναγερμοί, κύριο μενού (9 ενότητες, αριστερά), πίνακας ελέγχου (δεξιά), πληροφορίες παραγωγής, κουμπιά κάτω.",
                                full: "**Οθόνη HypCut:**\nΜαύρη περιοχή στο κέντρο = το σχέδιο. Λευκό πλαίσιο = το τραπέζι της μηχανής.\n1. **Γραμμή κατάστασης** (πάνω): κατάσταση, πού πάει η κεφαλή μετά την κοπή, κλείστρο, laser, ακολούθηση ύψους, αέριο, συναγερμός.\n2. **Μηνύματα/Συναγερμοί**: μαύρο = χωρίς πρόβλημα, κόκκινο = συναγερμός, κίτρινο = προειδοποίηση (διπλό κλικ = λεπτομέρειες).\n3. **Κύριο μενού** (αριστερά): οι 9 βασικές ενότητες.\n4. **Πίνακας ελέγχου** (δεξιά): τα κουμπιά που πατάτε συνέχεια (αν υπάρχει φυσικό πάνελ HyPanel, χρησιμοποιείτε τα πραγματικά κουμπιά).\n5. **Πληροφορίες παραγωγής**: βήμα, επιλογή δουλειάς, τεχνική.\n6. **Κουμπιά κάτω**: οι λειτουργίες της ενότητας που είστε."
                            },
                            {
                                keywords: ['μαζικη παραγωγη', 'μαζική παραγωγή', 'ευελικτη παραγωγη', 'ευέλικτη παραγωγή', 'batch production', 'flexible production'],
                                question: 'Ποια η διαφορά batch και flexible production;',
                                short: "**Batch (μαζική):** σταθερό μηδέν, για πολλά κομμάτια σε τυποποιημένες λαμαρίνες. **Flexible (ευέλικτη):** κινητό μηδέν (εκεί που είναι η κεφαλή), για λίγα κομμάτια/ακανόνιστα υπολείμματα.",
                                full: "**Τρόπος Παραγωγής:**\nΣτην ενότητα Production, πάνω αριστερά διαλέγετε:\n• **Batch production (μαζική):** Σταθερό μηδέν (σύστημα τεμαχίου) — το ορίζετε με Specify Zero ή εύρεση άκρης. Για πολλά κομμάτια σε τυποποιημένες λαμαρίνες, συνεχή παραγωγή.\n• **Flexible production (ευέλικτη):** Κινητό μηδέν — εκεί που είναι τώρα η κεφαλή, ή από εύρεση άκρης. Για λίγα κομμάτια, ακανόνιστες λαμαρίνες ή υπολείμματα."
                            },
                            {
                                keywords: ['βημα βημα', 'βήμα βήμα', 'ροη εργασιας', 'ροή εργασίας', 'διαδικασια κοπης', 'διαδικασία κοπής', 'more settings', 'ρυθμισεις more'],
                                question: 'Ποια είναι η ροή εργασίας βήμα-βήμα στο HypCut;',
                                short: "Τρόπος παραγωγής → Άνοιγμα σχεδίου → Διόρθωση σχεδίου → Τεχνική κοπής → Μηδέν → Ρυθμίσεις (More) → Κοπή.",
                                full: "**Η δουλειά βήμα-βήμα:**\n1. Διαλέγετε τρόπο παραγωγής (Batch/Flexible).\n2. **Άνοιγμα σχεδίου:** Open → Plan (ήδη μπηκε στο HypCut) ή Disk (νέο από USB/δίσκο). Μαζική: μόνο *.nrp/*.nrp2/*.lxd/*.lxds. Ευέλικτη: και *.dxf/*.nc.\n3. **Διόρθωση σχεδίου:** Graphic (κάτω) — σημείο αναφοράς, γραμμές εισόδου, αντιστάθμιση, μικρο-συνδέσεις, μέγεθος.\n4. **Τεχνική κοπής:** αν το σχέδιο δεν έχει «συνταγή», ανοίγει μόνο του το Select Technique. Αλλαγή με το χέρι: Production → Technique.\n5. **Μηδέν:** ευέλικτη = αυτόματα εκεί που είναι η κεφαλή (κάντε πρώτα Frame για ασφάλεια). Μαζική = ορίστε με Specify Zero.\n6. **More (ρυθμίσεις):** π.χ. Mark corner before cutting, Find edge before cutting, Pause after pre-pierce, Display modes.\n7. **Κοπή:** πριν πατήσετε Start — κανένας συναγερμός, σωστό σχέδιο/τεχνική/μηδέν. Frame πρώτα για να δείτε αν πέφτει μέσα στη λαμαρίνα."
                            }
                        ]
                    },
                    // 3. Προγραμματισμός (Plan) ----------------------------------
                    {
                        id: 'plan', title: 'Προγραμματισμός (Plan)',
                        topics: [
                            {
                                keywords: ['plan module', 'προγραμματισμος', 'προγραμματισμός', 'cypnest import', 'φερνω σχεδια', 'φέρνω σχέδια', 'ιστορικο δουλειων'],
                                question: 'Τι κάνει η ενότητα Plan στο HypCut;',
                                short: "Το **Plan** συνεργάζεται με το CypNest: εισάγει δουλειές (nesting) μέσω δικτύου/USB, κρατά ιστορικό ολοκληρωμένων δουλειών, βγάζει αναφορές παραγωγικότητας.",
                                full: "**Plan (Προγραμματισμός):**\nΣυνεργάζεται με το ξεχωριστό πρόγραμμα nesting **CypNest** — οργάνωση δουλειών/σχεδίων, πρόοδος παραγωγής, αναφορές, αντίγραφα ασφαλείας ιστορικού. Κάθε ολοκληρωμένη δουλειά αποθηκεύεται (για ξανακόψιμο/στατιστικά), και κάθε σχέδιο που ανοίγετε από δίσκο μπαίνει κι αυτό εδώ, με σειρά ημερομηνίας.\n\nΚουμπιά:\n• **Import:** φέρνει δουλειές CypNest από USB/δίκτυο στη λίστα Pending.\n• **Technique:** ορίζει τεχνική για την επιλεγμένη δουλειά/σχέδιο.\n• **Delete / Backup / Search / Pending / Finish** (σημειώνει τη δουλειά τελειωμένη).\n\nΡοή: επιλέγετε δουλειά → **Add** → όλα τα σχέδιά της πάνε στη σειρά παραγωγής δεξιά. Σημείωση: αλλαγή τεχνικής από το Plan αλλάζει και τη βιβλιοθήκη."
                            }
                        ]
                    },
                    // 4. Παραγωγή (Production) -----------------------------------
                    {
                        id: 'production', title: 'Παραγωγή (Production)',
                        topics: [
                            {
                                keywords: ['πινακας πληροφοριων', 'πίνακας πληροφοριών', 'marker', 'σελιδοδεικτες', 'σελιδοδείκτες', 'current drawing', 'task cloud task status'],
                                question: 'Τι δείχνει ο πίνακας πληροφοριών παραγωγής και τι είναι το Marker;',
                                short: "Τρεις καρτέλες: **Task** (στοιχεία σχεδίου), **Cloud Task** (nesting από CypNest/CloudNest), **Status** (ρυθμίσεις + πραγματικός χρόνος). Το **Marker** σώζει έως 32 σημεία τραπεζιού για γρήγορη μετάβαση.",
                                full: "**Πίνακας Πληροφοριών Παραγωγής:**\n• **Task:** στοιχεία τρέχοντος σχεδίου (σε nesting, όλα τα κομμάτια με μέγεθος/πλήθος).\n• **Cloud Task:** nesting που ήρθαν από CypNest/CloudNest.\n• **Status:** συνήθεις ρυθμίσεις, laser με το χέρι, στοιχεία σε πραγματικό χρόνο (Feed Speed, Coordinates, Beam/Size, Laser power, Nozzle distance).\n\n**Marker:** σώζετε θέσεις τραπεζιού (έως 32) για να πηγαίνει εκεί η κεφαλή γρήγορα — Marker → διαλέγετε σημείο → Current Coordinate ή γράφετε X,Y → μετά Locate To. Πριν πάει, ο Z ανεβαίνει τέρμα πάνω."
                            },
                            {
                                keywords: ['επιλογη σχηματος', 'επιλογή σχήματος', 'transform', 'μετασχηματισμος', 'μετασχηματισμός', 'μεγεθος σχεδιου', 'μέγεθος σχεδίου', 'size scale center'],
                                question: 'Πώς επιλέγω και αλλάζω μέγεθος σε σχήμα;',
                                short: "Κλικ ή κουτί επιλογής (αριστερά→δεξιά = μόνο ό,τι είναι ολόκληρο μέσα, δεξιά→αριστερά = ό,τι ακουμπά). Transform: Translate/Rotate/Align/Flip. Size → Modify Size για ακριβές μέγεθος.",
                                full: "**Επιλογή & Μέγεθος (Διόρθωση σχεδίου):**\n**Επιλογή:** Κλικ σε σχήμα, ή κουτί με σύρσιμο: αριστερά→δεξιά (μπλε, συνεχής) = πιάνει μόνο ό,τι είναι ολόκληρο μέσα· δεξιά→αριστερά (γαλάζιο, διακεκομμένη) = πιάνει ό,τι ακουμπά το κουτί. Shift+κλικ για προσθήκη/αφαίρεση.\n**Μέγεθος/Μετασχηματισμοί:** Transform: Translate, Rotate, Align, Flip. Size ▼ έχει 7 έτοιμα (π.χ. 100mm, 2X). Για ακριβές νούμερο: Size → Modify Size. Λουκέτο κλειστό = κρατά αναλογίες. Scale Center = ποιο σημείο μένει σταθερό. Exclude Techs = υπολογίζει μέγεθος χωρίς γραμμές εισόδου/αντιστάθμιση.\n⚠️ Γραμμές εισόδου και αντιστάθμιση δεν μεγαλώνουν μαζί με το σχήμα."
                            },
                            {
                                keywords: ['παραμετρους κοπης', 'παραμέτρους κοπής', 'παραμετρων κοπης', 'παραμέτρων κοπής', '7 layers', 'στρωματα κοπης', 'στρώματα κοπής', 'nozzle distance', 'layer settings', 'cutting parameters'],
                                question: 'Πώς ρυθμίζω τις παραμέτρους κοπής (layers);',
                                short: "Υπάρχουν **7 στρώματα (layers)** — 7 «συνταγές» με δική τους ταχύτητα, ισχύ, αέριο, **Nozzle distance** (όχι «Cut Height»). Mode: Standard / Fixed height cut / Out-plate follow.",
                                full: "**Ρυθμίσεις Κοπής (Production → Technique):**\nΥπάρχουν 7 layers (στρώματα), η καθεμία με δική της ταχύτητα/ισχύ/αέριο/απόσταση ακροφυσίου.\n**Mode:** Standard (κανονική) / Fixed height cut (σταθερό ύψος, Z κλειδωμένος) / Out-plate follow (ξεκινά έξω από τη λαμαρίνα σε σταθερό ύψος, ακολουθεί μόλις «δει» λαμαρίνα — για κόψιμο λαμαρίνας στα δύο).\n**Βασικές ρυθμίσεις:** Cut Speed (φρενάρει σε αρχές/τέλη/γωνίες) · **Nozzle distance** (πόσο ψηλά είναι το ακροφύσιο — αυτός είναι ο σωστός όρος, όχι «Cut Height») · Cut gas (αέρας/O2/N2) · Gas pressure · Laser power (το «ταβάνι» ισχύος) · Duty cycle · Pulse freq · Beam · Focus · Kerf width · Dwell time · Laser off delay.\n**Ομαλή αρχή/τέλος:** Smooth Start/End (χωριστές ρυθμίσεις για τα πρώτα/τελευταία mm).\n**Precision Cut:** Speedy cut (ταχύτητα, για πλέγματα) / Fine cut (ακρίβεια, τρύπες βιδών) / Precision fly cut / Custom.\n⚠️ Οι τιμές είναι ενδεικτικές — ρυθμίζονται ανά υλικό/laser/πίεση. Λάθος ρυθμίσεις = κακή κοπή ή ζημιά."
                            },
                            {
                                keywords: ['pierce', 'διάτρηση', 'διατρηση', 'smooth pierce', 'flash pierce', 'segment pierce', 'incremental pierce'],
                                question: 'Τι τύποι Pierce (διάτρησης) έχει το HypCut;',
                                short: "**Smooth Pierce** (frog leap, σταδιακή εστίαση), **Incremental Pierce** (παραμονή ανά ύψος), **Flash Pierce** (χοντρές λαμαρίνες), **Segment Pierce** (στάδια με δικές τους ρυθμίσεις).",

                                full: "**Οθόνη CypCut (§1.3.2):**\nΚέντρο σε μαύρο = drawing board, λευκό πλαίσιο = περιοχή εργασίας μηχανής.\nΠάνω: title bar, menu bar (File + 5 μενού: **Home, Draw, Nest, CNC, View**), toolbar σε στυλ Ribbon. Πάνω αριστερά: Quick Access Bar (create/open/save, undo/redo).\nΑριστερά: **Drawing toolbar** — τα πρώτα 5 κουμπιά αλλάζουν τρόπο σχεδίασης (selection, node editing, sequence editing, dragging, zooming).\nΔεξιά: **Technique toolbar** — κουμπί «Layer» (ανοίγει Cutting Technique window) + 17 κουμπιά χρωματιστών layers. Το πρώτο layer γίνεται αυτόματα «background layer» (δεν κατεργάζεται). Το τελευταίο και προτελευταίο layer κόβονται πρώτα/τελευταία (το προτελευταίο συνήθως ως marking layer).\nΚάτω: 3 παράθυρα κύλισης κειμένου (Draw / System / **Alarm** σε κόκκινο) + Status bar.\nΔεξιά πλευρά: **Control panel** — επιλογή συστήματος συντεταγμένων, χειροκίνητος έλεγχος, έλεγχος κατεργασίας, ρυθμίσεις διεργασίας, μέτρηση παραγωγής."

                                full: "**Lead Line (§3.1):**\n• **Distinguish Inner/Outer Contour:** αυτόματο στην εισαγωγή DXF — το εξωτερικό περίγραμμα κόβεται από έξω, το lead line σε εσωτερικό ξεκινά από μέσα. Χειροκίνητα: κουμπί στο Home menu, ή group + group sort για να ορίσετε ποιο είναι εξωτερικό.\n• **Automatic Lead Line:** τύπος (ευθεία, τόξο, ευθεία+τόξο), γωνία, μήκος, ακτίνα· προαιρετικά μικρός κύκλος στην αρχή. Σε τόξο, η άκρη είναι εφαπτόμενη στο γραφικό.\n• **Manual-set Lead Line:** κλικ πάνω στο γραφικό αλλάζει μόνο τη θέση (μήκος/γωνία ίδια)· κλικ έξω μετά πάνω δημιουργεί νέο lead line.\n• **Check Lead Line:** ελέγχει όλα τα lead lines, κονταίνει όσα τέμνονται με το γραφικό ή έχουν λάθος μήκος.\n• **Overcut, Gap, Seal, Multi-cut:** 4 επιπλέον επιλογές στην τεχνική στήλη — δεν επηρεάζουν γραφικό που ήδη έχει gap/overcut."

                                full: "**Micro-joint (§3.3):**\nΠροσθέτει μικρή απόσταση-σύνδεσμο στο γραφικό — το laser δεν πυροδοτεί εκεί, ώστε το κομμάτι να μη φεύγει από τον σκελετό της πλάκας ούτε να σηκωθεί και συγκρουστεί με την κεφαλή. Εμφανίζεται σαν άνοιγμα (breach) στο σχέδιο.\nΚλικ στο κουμπί micro-joint, μετά κλικ στο σημείο του γραφικού (πολλαπλά κλικ = πολλά micro-joints, ESC για έξοδο). Μπορεί να μπει και πάνω στη γραμμή αντιστάθμισης.\n**Auto micro-joint:** by count (π.χ. 10 = 10 micro-joints ανά γραφικό) ή by distance (π.χ. κάθε 100mm).\n**Explode micro-joint:** κάθε τμήμα γίνεται ξεχωριστό αντικείμενο για επεξεργασία (π.χ. προσθήκη lead line σε κάθε τμήμα).\nΑφαίρεση: 'Clear micro-joint' στο drop-down Clear.\nΑπό **CypCut V731+**: FlyCut strategy — η κεφαλή περνά το micro-joint χωρίς να σηκωθεί ή να επιβραδύνει, για μεγαλύτερη ταχύτητα."

                                full: "**Cooling Point (§3.4):**\nΚλικ στο κουμπί Cooling Point μετά κλικ στο γραφικό προσθέτει σημείο ψύξης (πολλαπλά με συνεχόμενα κλικ). Όταν η μηχανή φτάσει εκεί: σβήνει laser, ανοίγει αέριο για προκαθορισμένο delay, μετά ανάβει laser/κλείνει αέριο και συνεχίζει κανονικά. Εμφανίζεται ως συμπαγής λευκή τελεία.\n**Auto Cooling Point:** επιλέγετε αυτόματη προσθήκη σε sharp corner ή/και lead line. Αν το cooling point είναι πάνω σε lead line, ενσωματώνεται με αυτό (το 'Clear cooling point' δεν το σβήνει — μόνο η διαγραφή του ίδιου του lead line).\nΧρησιμοποιείται συχνά σε γωνίες κομματιού, ώστε να μη ζεσταθεί/καεί η γωνία."

        // "Μεσάζοντας" (Cloudflare Worker) που κρατάει το Gemini API key κρυφό
        const AI_ENDPOINT = "https://hypcypcut-ai.ramnalialexandra.workers.dev";

        let currentSystem = localStorage.getItem('lc_system') || 'hypcut';
        let currentCategoryId = null;

        function setSystem(system) {
            currentSystem = system;
            localStorage.setItem('lc_system', system);
            currentCategoryId = SYSTEMS[system].categories[0].id;
            renderSystemToggle();
            renderCategoryBar();
            renderTopicBar();
            document.getElementById('userInput').placeholder =
                `Ρωτήστε οτιδήποτε σχετικά με το ${SYSTEMS[system].label}...`;
        }

        function renderSystemToggle() {
            const activeCls = 'bg-indigo-600 text-white';
            const inactiveCls = 'text-slate-400 hover:text-white';
            const hyp = document.getElementById('btnHypcut');
            const cyp = document.getElementById('btnCypcut');
            hyp.className = 'px-3 py-1.5 rounded-full transition ' + (currentSystem === 'hypcut' ? activeCls : inactiveCls);
            cyp.className = 'px-3 py-1.5 rounded-full transition ' + (currentSystem === 'cypcut' ? activeCls : inactiveCls);
        }

        function renderCategoryBar() {
            const bar = document.getElementById('categoryBar');
            bar.innerHTML = '<span class="text-slate-500 font-medium whitespace-nowrap pl-1">Κατηγορίες:</span>';
            SYSTEMS[currentSystem].categories.forEach(cat => {
                const btn = document.createElement('button');
                const active = cat.id === currentCategoryId;
                btn.className = 'whitespace-nowrap px-3 py-1.5 rounded-lg border transition ' +
                    (active
                        ? 'bg-indigo-600 border-indigo-500 text-white'
                        : 'bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border-slate-700/80 hover:border-slate-500');
                btn.textContent = cat.title;
                btn.onclick = () => { currentCategoryId = cat.id; renderCategoryBar(); renderTopicBar(); };
                bar.appendChild(btn);
            });
        }

        function renderTopicBar() {
            const bar = document.getElementById('topicBar');
            bar.innerHTML = '';
            const cat = SYSTEMS[currentSystem].categories.find(c => c.id === currentCategoryId);
            if (!cat) return;
            cat.topics.forEach(topic => {
                const btn = document.createElement('button');
                btn.className = 'whitespace-nowrap px-3 py-1.5 rounded-lg bg-slate-800/60 hover:bg-slate-700 text-slate-300 hover:text-white transition border border-slate-700/50 hover:border-slate-500';
                btn.textContent = topic.question;
                btn.onclick = () => askPreset(topic.question);
                bar.appendChild(btn);
            });
        }

        function askPreset(questionText) {
            document.getElementById('userInput').value = questionText;
            handleUserSubmit(new Event('submit'));
        }

        async function handleUserSubmit(event) {
            event.preventDefault();
            const inputEl = document.getElementById('userInput');
            const query = inputEl.value.trim();
            if (!query) return;

            // Display User Message
            appendMessage(query, 'user');
            inputEl.value = '';

            // 1) Πρώτα ψάχνει στην τοπική βάση γνώσης του επιλεγμένου συστήματος
            const kbAnswer = getKbAnswer(query);
            if (kbAnswer) {
                const answerSystem = currentSystem;
                setTimeout(() => {
                    const bubble = appendMessage(kbAnswer, 'bot');
                    appendManualImages(bubble, kbAnswer, answerSystem);
                }, 300);
                return;
            }

            // 2) Αν δεν βρεθεί, ρωτάει το AI (Gemini) μέσω του μεσάζοντα
            const thinkingBubble = appendMessage('Σκέφτομαι… 🤔', 'bot');
            try {
                const aiAnswer = await askAI(query);
                updateMessage(thinkingBubble, aiAnswer);
            } catch (err) {
                updateMessage(thinkingBubble, fallbackAnswer(query));
            }
        }

        function normalizeQuery(query) {
            return query.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .toLowerCase().replace(/\u03c2/g, '\u03c3')
                .replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
        }

        function getKbAnswer(query) {
            const lowerQuery = normalizeQuery(query);
            const wordCount = query.trim().split(/\s+/).filter(Boolean).length;
            const topics = SYSTEMS[currentSystem].categories.flatMap(c => c.topics);

            const exactTopic = topics.find(item => normalizeQuery(item.question) === lowerQuery);
            if (exactTopic) return exactTopic.full;

            for (const item of topics) {
                if (item.keywords.some(kw => lowerQuery.includes(normalizeQuery(kw)))) {
                    return wordCount <= 4 ? item.short : item.full;
                }
            }
            return null;
        }

        async function askAI(question) {
            const res = await fetch(AI_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question, system: currentSystem })
            });
            if (!res.ok) throw new Error('AI request failed');
            const data = await res.json();
            if (data.error) throw new Error(data.error);
            return data.answer;
        }

        function fallbackAnswer(query) {
            const sys = SYSTEMS[currentSystem].label;
            return `Δεν μπόρεσα να συνδεθώ με τον AI βοηθό αυτή τη στιγμή (πιθανόν πρόβλημα δικτύου).\n\n` +
                   `Δοκίμασε ξανά σε λίγο, ή διάλεξε μια κατηγορία από πάνω για να δεις τι ξέρω ήδη για το **${sys}**.`;
        }

        function appendMessage(text, sender) {
            const chatWindow = document.getElementById('chatWindow');
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex items-start gap-3 ${sender === 'user' ? 'flex-row-reverse' : ''}`;

            const avatar = document.createElement('div');
            avatar.className = `w-9 h-9 rounded-xl flex items-center justify-center text-sm font-bold flex-shrink-0 shadow-lg ${
                sender === 'user'
                    ? 'bg-slate-700 text-slate-200'
                    : 'bg-indigo-600 text-white shadow-indigo-500/20'
            }`;
            avatar.innerText = sender === 'user' ? '👤' : '🤖';

            const bubble = document.createElement('div');
            bubble.className = `rounded-2xl p-4 text-sm max-w-[85%] leading-relaxed shadow-md ${
                sender === 'user'
                    ? 'bg-indigo-600 text-white rounded-tr-none'
                    : 'bg-slate-800/90 text-slate-200 border border-slate-700/60 rounded-tl-none'
            }`;

            // Format newlines & bold text
            bubble.innerHTML = text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            msgDiv.appendChild(avatar);
            msgDiv.appendChild(bubble);
            chatWindow.appendChild(msgDiv);

            chatWindow.scrollTop = chatWindow.scrollHeight;
            return bubble;
        }

        function updateMessage(bubble, text) {
            bubble.innerHTML = text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            document.getElementById('chatWindow').scrollTop = document.getElementById('chatWindow').scrollHeight;
        }

        // Init
        currentCategoryId = SYSTEMS[currentSystem].categories[0].id;
        renderSystemToggle();
        renderCategoryBar();
        renderTopicBar();
        document.getElementById('userInput').placeholder =
            `Ρωτήστε οτιδήποτε σχετικά με το ${SYSTEMS[currentSystem].label}...`;
    </script>
